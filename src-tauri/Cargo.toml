[package]
name = "resydney"
version = "0.1.0"
edition = "2021"

[lib]
name = "resydney_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
once_cell = "1.21.4"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["wry"] }
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30"
url = "2.5.8"

[dev-dependencies]
tauri-build = "2"
