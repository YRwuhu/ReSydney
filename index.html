<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReSydney</title>
    <style>
      /* 启动遮罩：bundle 加载前即渲染，底色随深浅主题（与 globals.scss/dark.scss 主背景一致） */
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      html.dark,
      html.dark body {
        background: #11100f;
      }
      #launch-mask {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      html.dark #launch-mask {
        background: #11100f;
      }
      #launch-mask img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
        animation: launch-pulse 1.8s ease-in-out infinite;
      }
      @keyframes launch-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(0.96);
        }
      }
      #launch-mask.launch-mask-leave {
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
    </style>
    <script>
      // bundle 加载前预判主题，保证遮罩/首屏底色与深浅模式一致，避免闪白。
      // next-themes 将主题存于 localStorage['theme']（light | dark | system）；
      // 这里只做预判，React 挂载后由 next-themes 接管，二者结果一致不会跳变。
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* 隐私模式等读取失败时按浅色处理 */
        }
        // 应用就绪后由 main.tsx 调用移除；附超时兜底，防止异常时遮罩一直挡住界面
        var dismissed = false
        window.__dismissLaunchMask = function () {
          if (dismissed) return
          dismissed = true
          var mask = document.getElementById('launch-mask')
          if (!mask) return
          mask.classList.add('launch-mask-leave')
          setTimeout(function () {
            mask.remove()
          }, 400)
        }
        setTimeout(window.__dismissLaunchMask, 12000)
      })()
    </script>
  </head>
  <body>
    <div id="launch-mask" aria-hidden="true">
      <img src="/favicon.svg" alt="" width="96" height="96" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
