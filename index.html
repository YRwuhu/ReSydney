<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReSydney</title>
    <style>
      /* 启动遮罩：bundle 加载前即渲染，底色随深浅主题（与 globals.scss/dark.scss 主背景一致） */
      html,
      body {
        margin: 0;
        background: #ffffff;
      }
      html.dark,
      html.dark body {
        background: #11100f;
      }
      /* 无已存主题时的系统偏好兜底（与预判脚本一致；显式 light/dark 时由类名覆盖） */
      @media (prefers-color-scheme: dark) {
        html:not(.light):not(.dark),
        html:not(.light):not(.dark) body {
          background: #11100f;
        }
        html:not(.light):not(.dark) #launch-mask {
          background: #11100f;
        }
      }
      #launch-mask {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }
      html.dark #launch-mask {
        background: #11100f;
      }
      /* 图标直接展示，不加圆角框/阴影 */
      #launch-mask img {
        width: 96px;
        height: 96px;
        animation: launch-pulse 1.8s ease-in-out infinite;
      }
      @keyframes launch-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(0.96);
        }
      }
      #launch-mask.launch-mask-leave {
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
    </style>
    <script>
      // bundle 加载前预判主题，保证遮罩/首屏底色与深浅模式一致，避免闪白。
      // next-themes 将主题存于 localStorage['theme']（light | dark | system）；
      // 这里只做预判，React 挂载后由 next-themes 接管，二者结果一致不会跳变。
      (function () {
        function isSystemDark() {
          try {
            return window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch (e) {
            return false
          }
        }
        var html = document.documentElement
        var dark = isSystemDark()
        try {
          var theme = localStorage.getItem('theme')
          if (theme === 'dark') dark = true
          else if (theme === 'light') dark = false
          else if (theme === 'system') dark = isSystemDark()
          // 无已存主题：跟随系统（与上面 CSS 兜底一致）
        } catch (e) {
          // localStorage 不可用（隐私模式/部分 WebView 环境）：保持系统偏好
        }
        html.classList.add(dark ? 'dark' : 'light')
        // 应用就绪后由 main.tsx 调用移除；附超时兜底，防止异常时遮罩一直挡住界面
        var dismissed = false
        window.__dismissLaunchMask = function () {
          if (dismissed) return
          dismissed = true
          var mask = document.getElementById('launch-mask')
          if (!mask) return
          mask.classList.add('launch-mask-leave')
          setTimeout(function () {
            mask.remove()
          }, 400)
        }
        setTimeout(window.__dismissLaunchMask, 12000)
      })()
    </script>
  </head>
  <body>
    <div id="launch-mask" aria-hidden="true">
      <img src="/favicon.svg" alt="" width="96" height="96" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
